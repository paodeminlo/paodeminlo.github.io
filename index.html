<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menu com 2 Botões</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Escolha uma opção</h1>

    <div class="buttons">
      <div class="menu-wrapper">
        <button id="btnA" class="action-btn" aria-haspopup="true" aria-expanded="false">
          Botão A
        </button>
        <ul id="menuA" class="menu" role="menu" aria-label="Opções do Botão A">
          <!-- Substitua os itens abaixo pelos links que você vai enviar -->
          <li role="none"><a role="menuitem" href="https://example.com/1" target="_blank" rel="noopener">Opção A1</a></li>
          <li role="none"><a role="menuitem" href="https://example.com/2" target="_blank" rel="noopener">Opção A2</a></li>
          <li role="none"><a role="menuitem" href="https://example.com/3" target="_blank" rel="noopener">Opção A3</a></li>
        </ul>
      </div>

      <div class="menu-wrapper">
        <button id="btnB" class="action-btn" aria-haspopup="true" aria-expanded="false">
          Botão B
        </button>
        <ul id="menuB" class="menu" role="menu" aria-label="Opções do Botão B">
          <!-- Substitua os itens abaixo pelos links que você vai enviar -->
          <li role="none"><a role="menuitem" href="https://example.com/4" target="_blank" rel="noopener">Opção B1</a></li>
          <li role="none"><a role="menuitem" href="https://example.com/5" target="_blank" rel="noopener">Opção B2</a></li>
          <li role="none"><a role="menuitem" href="https://example.com/6" target="_blank" rel="noopener">Opção B3</a></li>
        </ul>
      </div>
    </div>

    <p class="hint">Dica: envie as URLs/nomes que quer em cada menu e eu já atualizo aqui pra você.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
