<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Scripts</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #161b22;
      padding: 15px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #30363d;
    }

    .sidebar button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
      transition: background 0.3s, transform 0.1s;
    }

    .sidebar button:hover {
      background: #30363d;
      transform: translateX(3px);
    }

    /* Área de conteúdo */
    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .script {
      display: none;
      background: #161b22;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #30363d;
      white-space: pre-wrap;
      font-family: monospace;
      color: #58a6ff;
    }

    .script.active {
      display: block;
    }

    h2 {
      color: #f0f6fc;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button onclick="mostrar('script1')">Script 1</button>
    <button onclick="mostrar('script2')">Script 2</button>
    <button onclick="mostrar('script3')">Script 3</button>
  </div>

  <div class="content">
    <div id="script1" class="script active">
      <h2>Script 1</h2>
      <pre>
console.log("Executando Script 1");
      </pre>
    </div>

    <div id="script2" class="script">
      <h2>Script 2</h2>
      <pre>
alert("Rodando Script 2");
      </pre>
    </div>

    <div id="script3" class="script">
      <h2>Script 3</h2>
      <pre>
function exemplo() {
  return "Script 3 funcionando!";
}
      </pre>
    </div>
  </div>

  <script>
    function mostrar(id) {
      document.querySelectorAll('.script').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>
</body>
</html>
